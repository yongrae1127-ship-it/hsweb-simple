<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>유용래 | Personal Portfolio</title>

  <!-- Nanum Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --black: #090909;
      --black-soft: #111111;
      --dark: #181818;
      --white: #ffffff;
      --gray: #b7b7b7;
      --light-gray: #eeeeee;

      --autumn-orange: #d97735;
      --autumn-gold: #e6a23c;
      --sky-blue: #8ec5e8;

      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.16);

      --max-width: 1180px;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Nanum Gothic", sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: 0.35s ease;
    }

    header.scrolled {
      background: rgba(5, 5, 5, 0.88);
      backdrop-filter: blur(15px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    .nav {
      width: min(var(--max-width), 92%);
      height: 76px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--autumn-orange);
    }

    .nav-menu {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-menu a {
      position: relative;
      color: rgba(255,255,255,.82);
      font-size: 14px;
      transition: .25s;
    }

    .nav-menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 2px;
      background: var(--autumn-orange);
      transition: .25s;
    }

    .nav-menu a:hover {
      color: white;
    }

    .nav-menu a:hover::after {
      width: 100%;
    }

    .menu-btn {
      display: none;
      background: none;
      border: 0;
      color: white;
      font-size: 27px;
      cursor: pointer;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;

      background:
        linear-gradient(
          115deg,
          rgba(0,0,0,.84),
          rgba(0,0,0,.42),
          rgba(0,0,0,.68)
        ),
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2400&q=90")
        center/cover no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at 75% 30%,
          rgba(255,166,81,.25),
          transparent 25%
        );
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      bottom: -100px;
      left: -5%;
      width: 110%;
      height: 220px;
      background: var(--black);
      border-radius: 50% 50% 0 0;
    }

    .hero-content {
      width: min(var(--max-width), 92%);
      margin: auto;
      position: relative;
      z-index: 2;
      padding-top: 70px;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
      border-radius: 100px;
      color: #f3f3f3;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .hero-label::before {
      content: "";
      width: 7px;
      height: 7px;
      background: #78d48a;
      border-radius: 50%;
      box-shadow: 0 0 10px #78d48a;
    }

    .hero h1 {
      font-size: clamp(48px, 8vw, 96px);
      line-height: 1.05;
      letter-spacing: -5px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .hero h1 .orange {
      color: var(--autumn-orange);
    }

    .hero-description {
      max-width: 670px;
      color: rgba(255,255,255,.78);
      font-size: clamp(16px, 2vw, 20px);
      margin-bottom: 35px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      padding: 14px 22px;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,.2);
      transition: .3s;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-primary {
      background: white;
      color: black;
    }

    .btn-primary:hover {
      background: var(--autumn-orange);
      color: white;
      transform: translateY(-3px);
    }

    .btn-dark {
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    .btn-dark:hover {
      background: rgba(255,255,255,.12);
      transform: translateY(-3px);
    }

    .scroll-down {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 11px;
      color: rgba(255,255,255,.6);
      letter-spacing: 2px;
      animation: floating 2s infinite;
    }

    @keyframes floating {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, 8px); }
    }

    /* =========================
       COMMON
    ========================= */

    section {
      padding: 110px 0;
    }

    .container {
      width: min(var(--max-width), 92%);
      margin: auto;
    }

    .section-heading {
      margin-bottom: 55px;
    }

    .section-number {
      color: var(--autumn-orange);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(32px, 5vw, 52px);
      letter-spacing: -2px;
      line-height: 1.2;
    }

    .section-description {
      margin-top: 12px;
      color: #999;
      max-width: 650px;
    }

    /* =========================
       ABOUT
    ========================= */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 70px;
      align-items: center;
    }

    .profile-card {
      position: relative;
      min-height: 460px;
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(145deg, #242424, #090909);
      border: 1px solid var(--glass-border);
    }

    .profile-card::before {
      content: "Y";
      position: absolute;
      right: -35px;
      bottom: -80px;
      font-size: 320px;
      font-weight: 800;
      color: rgba(255,255,255,.035);
      line-height: 1;
    }

    .profile-inner {
      position: absolute;
      inset: 25px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.85),
          transparent 70%
        );
    }

    .profile-icon {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 75px;
      height: 75px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--autumn-orange);
      font-size: 34px;
      box-shadow: 0 15px 35px rgba(217,119,53,.25);
    }

    .profile-inner h3 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .profile-inner p {
      color: #aaa;
      font-size: 14px;
    }

    .about-text h3 {
      font-size: 27px;
      margin-bottom: 20px;
    }

    .about-text > p {
      color: #bdbdbd;
      margin-bottom: 30px;
    }

    .info-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .info-item {
      padding: 18px;
      background: #111;
      border: 1px solid #242424;
      border-radius: 15px;
    }

    .info-item small {
      color: #777;
      display: block;
      margin-bottom: 3px;
    }

    .info-item strong {
      font-size: 14px;
    }

    /* =========================
       TIMELINE
    ========================= */

    .timeline {
      position: relative;
      max-width: 900px;
      margin: auto;
